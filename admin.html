<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1a3a">
<title>نبض الحياة - لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e1a3a;--bg:#f4f1ec;--red:#a3122a;--red-soft:#fde8e8;--teal:#0f766e;--muted:#6b7285;--line:#e7e2da}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:#1b2236}
header{background:linear-gradient(135deg,#0e1a3a,#1f3470);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:0 0 24px 24px}
header b{font-size:17px}header small{display:block;opacity:.75;font-size:12px}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0e1a3a0d}
h2{font-size:18px;margin:18px 2px 10px;color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-size:26px;color:var(--red)}.kpi span{font-size:12px;color:var(--muted)}
input,select{font:inherit;width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px;background:#fbfaf8}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;height:42px;padding:0 14px;cursor:pointer;background:#eaf4fb;color:#1b2236;text-decoration:none;display:inline-grid;place-items:center}
.btn.main{background:linear-gradient(135deg,#b3122b,#8b0f22);color:#fff}.btn.green{background:var(--teal);color:#fff}
.btn.full{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.top{display:flex;gap:12px;align-items:center}
.bt{min-width:52px;height:52px;border-radius:14px;background:var(--red);color:#fff;font-weight:900;font-size:18px;display:grid;place-items:center}
.bt.g{background:var(--teal)}
small,.hint{color:var(--muted);font-size:12px;display:block;line-height:1.7}
.chip{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700;background:var(--red-soft);color:var(--red)}
.chip.ok{background:#d9f7f3;color:#0b4d47}.chip.mid{background:#fff1d6;color:#7a4a00}
.match{border-top:1px solid var(--line);padding:10px 0}
#login{max-width:380px;margin:60px auto}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b2236;color:#fff;padding:10px 18px;border-radius:16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}.ov.on{display:flex}
.box{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:400px}
</style>
</head>
<body>
<div class="wrap" id="login" style="display:none">
  <div class="card">
    <h2 style="margin-top:0">لوحة تحكم نبض الحياة</h2>
    <p class="hint" style="margin-bottom:12px">للموظفين والسائقين فقط</p>
    <input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr">
    <input id="pw" type="password" placeholder="كلمة المرور" dir="ltr">
    <div class="err" id="lerr"></div>
    <button class="btn main full" onclick="login()">دخول</button>
  </div>
</div>
<div id="app" style="display:none">
  <header><div><b>نبض الحياة - لوحة التحكم</b><small id="who"></small></div><button class="btn" onclick="logout()">خروج</button></header>
  <div class="wrap" id="main"></div>
</div>
<div class="ov" id="ov"><div class="box" id="ovb"></div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script type="module">
const CFG = window.LD_CONFIG || {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); };
const fmt = d => d.toISOString().slice(0,10);

/* منطق التوافق والأهلية والمسافة (نفس منطق التطبيق) */
const BT = ["O-","O+","A-","A+","B-","B+","AB-","AB+"];
const CAN_GIVE = {"O-":BT,"O+":["O+","A+","B+","AB+"],"A-":["A-","A+","AB-","AB+"],"A+":["A+","AB+"],"B-":["B-","B+","AB-","AB+"],"B+":["B+","AB+"],"AB-":["AB-","AB+"],"AB+":["AB+"]};
const canGive = (d, p) => (CAN_GIVE[d] || []).includes(p);
const km = (a, b) => { const R = 6371, r = x => x*Math.PI/180, dL = r(b.lat-a.lat), dG = r(b.lng-a.lng);
  const h = Math.sin(dL/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dG/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
function eligible(d){
  if(!(d.age >= 18 && d.age <= 65) || !(d.weight >= 50) || d.clear === false) return false;
  if(d.last){ const t = new Date(d.last).getTime(); if(isNaN(t) || t > Date.now() || (Date.now()-t)/864e5 < 90) return false; }
  return true;
}
const URG = {high:"عاجل جداً", mid:"خلال يوم", low:"عادي"};
const ST = {assigned:"مكلّفة", enroute:"في الطريق للمتبرع", picked:"مع المتبرع", done:"وصلت للمستشفى", cancelled:"ملغاة"};
const NEXT = {assigned:["enroute","بدأت التحرك"], enroute:["picked","وصلت للمتبرع"], picked:["done","سلّمت للمستشفى"]};
const nav = l => `https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}`;

/* Firebase */
let fs, auth, F, A, user, role = null, staffName = "";
let reqs = [], donors = [], disp = [], drivers = [];

async function init(){
  if(!CFG.firebase || String(CFG.firebase.apiKey).startsWith("YOUR_")){ document.body.innerHTML = '<div class="wrap"><div class="card">لم تُضبط مفاتيح Firebase في config.js.</div></div>'; return; }
  const b = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [app, au, fi] = await Promise.all([import(b+"firebase-app.js"), import(b+"firebase-auth.js"), import(b+"firebase-firestore.js")]);
  const a = app.initializeApp(CFG.firebase); A = au; F = fi; auth = au.getAuth(a); fs = fi.getFirestore(a);
  A.onAuthStateChanged(auth, async u => { user = u; await enter(); });
}
async function login(){
  $("lerr").textContent = "";
  try{ await A.signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch(e){ $("lerr").textContent = "البريد أو كلمة المرور غير صحيحة."; }
}
async function logout(){ await A.signOut(auth); }

async function enter(){
  $("login").style.display = user ? "none" : "block";
  $("app").style.display = user ? "block" : "none";
  if(!user) return;
  const s = await F.getDoc(F.doc(fs, "staff", user.uid));
  if(!s.exists() || !["admin","driver"].includes(s.data().role)){
    role = null; $("who").textContent = user.email;
    $("main").innerHTML = `<div class="card"><b>حسابك غير مسجّل كموظف.</b><p class="hint">اطلب من المسؤول إضافة مستند لك في مجموعة staff.<br>رقم حسابك (UID):<br><span dir="ltr" style="user-select:all">${esc(user.uid)}</span></p></div>`;
    return;
  }
  role = s.data().role; staffName = s.data().name || user.email;
  $("who").textContent = `${staffName} - ${role === "admin" ? "مشرف" : "سائق"}`;
  await refresh();
}
async function refresh(){
  try{
    if(role === "admin"){
      const [r, d, x, s] = await Promise.all([
        F.getDocs(F.query(F.collection(fs,"requests"), F.orderBy("created","desc"), F.limit(50))),
        F.getDocs(F.collection(fs,"donors")), F.getDocs(F.collection(fs,"dispatches")),
        F.getDocs(F.query(F.collection(fs,"staff"), F.where("role","==","driver")))
      ]);
      reqs = r.docs.map(z => ({...z.data(), id:z.id})); donors = d.docs.map(z => ({...z.data(), uid:z.id}));
      disp = x.docs.map(z => ({...z.data(), id:z.id})).sort((a,b) => b.created - a.created);
      drivers = s.docs.map(z => ({uid:z.id, name:z.data().name || z.id}));
      renderAdmin();
    } else {
      const x = await F.getDocs(F.query(F.collection(fs,"dispatches"), F.where("driverUid","==",user.uid)));
      disp = x.docs.map(z => ({...z.data(), id:z.id})).sort((a,b) => b.created - a.created);
      renderDriver();
    }
  }catch(e){ toast("تعذر تحميل البيانات. راجع قواعد Firestore."); }
}

/* ===== لوحة المشرف ===== */
function matches(r){
  if(r.lat == null) return [];
  return donors.filter(d => d.uid !== r.uid && d.lat != null && d.available !== false && canGive(d.bt, r.bt) && eligible(d))
    .map(d => ({d, dist: km(r, d)})).sort((a,b) => a.dist - b.dist).slice(0, 8);
}
function renderAdmin(){
  const active = disp.filter(x => !["done","cancelled"].includes(x.status));
  const done = disp.filter(x => x.status === "done").length;
  const dname = id => (drivers.find(z => z.uid === id) || {}).name || "-";
  $("main").innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${reqs.length}</b><span>طلبات دم</span></div>
      <div class="kpi"><b>${reqs.filter(r => r.urg === "high").length}</b><span>طلبات عاجلة</span></div>
      <div class="kpi"><b>${donors.filter(eligible).length}</b><span>متبرعون مؤهلون</span></div>
      <div class="kpi"><b>${active.length}</b><span>مهام جارية</span></div>
      <div class="kpi"><b>${done}</b><span>مهام مكتملة</span></div>
    </div>
    <h2>المهام الجارية للسيارات</h2>
    ${active.length ? active.map(x => `<div class="card"><div class="top"><div class="bt g">${esc(x.donorBt)}</div><div style="flex:1">
      <b>${esc(x.donorName)}</b><small>إلى ${esc(x.hospName)} - السائق: ${esc(dname(x.driverUid))}</small>
      <span class="chip ${x.status === "assigned" ? "mid" : "ok"}">${ST[x.status]}</span></div></div>
      <div class="row"><a class="btn" href="tel:${esc(x.donorPhone)}">اتصال بالمتبرع</a><a class="btn" href="${nav(x.donorLoc)}" target="_blank" rel="noopener">موقع المتبرع</a>
      ${x.driverLoc ? `<a class="btn" href="${nav(x.driverLoc)}" target="_blank" rel="noopener">آخر موقع للسائق</a>` : ""}
      <button class="btn" onclick="cancelDisp('${x.id}')">إلغاء</button></div></div>`).join("") : '<div class="card hint">لا توجد مهام جارية.</div>'}
    <h2>طلبات الدم</h2>
    ${reqs.length ? reqs.map(r => `<div class="card"><div class="top"><div class="bt">${esc(r.bt)}</div><div style="flex:1">
      <b>${esc(r.name)}</b><small>${esc(r.hosp)} - ${esc(r.units)} وحدة - ${new Date(r.created).toLocaleString("ar")}</small>
      <span class="chip ${r.urg === "high" ? "" : "mid"}">${URG[r.urg] || ""}</span></div></div>
      <div class="row"><a class="btn" href="tel:${esc(r.phone)}">اتصال</a><button class="btn green" onclick="showMatches('${r.id}')">أقرب المتبرعين</button></div>
      <div id="m-${r.id}"></div></div>`).join("") : '<div class="card hint">لا توجد طلبات.</div>'}`;
}
function showMatches(id){
  const r = reqs.find(x => x.id === id), box = $("m-" + id);
  if(box.innerHTML){ box.innerHTML = ""; return; }
  const list = matches(r);
  box.innerHTML = !list.length ? '<p class="hint" style="margin-top:10px">لا يوجد متبرعون متوافقون ومؤهلون بموقع معروف.</p>' :
    list.map(m => `<div class="match"><div class="top"><div class="bt g" style="min-width:44px;height:44px;font-size:15px">${esc(m.d.bt)}</div><div style="flex:1">
      <b>${esc(m.d.name)}</b><small>يبعد ${m.dist.toFixed(1)} كم - ${esc(m.d.phone)}</small></div></div>
      <div class="row"><a class="btn" href="tel:${esc(m.d.phone)}">اتصال</a><button class="btn main" onclick="assign('${id}','${m.d.uid}')">تكليف سيارة</button></div></div>`).join("");
}
function assign(rid, duid){
  if(!drivers.length){ toast("لا يوجد سائقون. أضف مستند staff بدور driver."); return; }
  $("ovb").innerHTML = `<h2 style="margin-top:0">اختر السائق</h2><select id="drv">${drivers.map(z => `<option value="${esc(z.uid)}">${esc(z.name)}</option>`).join("")}</select>
    <button class="btn main full" onclick="confirmAssign('${rid}','${duid}')">تأكيد التكليف</button>
    <button class="btn full" style="margin-top:8px" onclick="closeOv()">إلغاء</button>`;
  $("ov").classList.add("on");
}
function closeOv(){ $("ov").classList.remove("on"); }
async function confirmAssign(rid, duid){
  const r = reqs.find(x => x.id === rid), d = donors.find(x => x.uid === duid), driverUid = $("drv").value;
  try{
    const b = F.writeBatch(fs);
    b.set(F.doc(F.collection(fs,"dispatches")), {reqId:rid, donorUid:duid, donorName:d.name, donorBt:d.bt, donorPhone:d.phone, donorLoc:{lat:d.lat,lng:d.lng},
      hospName:r.hosp, hospLoc:{lat:r.lat,lng:r.lng}, driverUid, status:"assigned", created:Date.now(), updated:Date.now(), by:user.uid});
    b.set(F.doc(F.collection(fs,"notifications")), {to:duid, from:user.uid, reqId:rid, title:"سيارة إسعاف في طريقها إليك",
      body:`تم تكليف سيارة لنقلك إلى ${r.hosp} للتبرع للمريض ${r.name}.`, tel:"", created:Date.now(), read:false});
    await b.commit(); closeOv(); toast("تم تكليف السيارة وإبلاغ المتبرع"); await refresh();
  }catch(e){ toast("تعذر التكليف. راجع قواعد Firestore."); }
}
async function cancelDisp(id){
  if(!confirm("إلغاء هذه المهمة؟")) return;
  try{ await F.updateDoc(F.doc(fs,"dispatches",id), {status:"cancelled", updated:Date.now()}); await refresh(); }catch(e){ toast("تعذر الإلغاء."); }
}

/* ===== واجهة السائق ===== */
function renderDriver(){
  const active = disp.filter(x => !["done","cancelled"].includes(x.status));
  $("main").innerHTML = `<h2>مهامي</h2>` + (active.length ? active.map(x => `<div class="card"><div class="top"><div class="bt g">${esc(x.donorBt)}</div><div style="flex:1">
    <b>${esc(x.donorName)}</b><small>الوجهة: ${esc(x.hospName)}</small><span class="chip mid">${ST[x.status]}</span></div></div>
    <div class="row"><a class="btn" href="tel:${esc(x.donorPhone)}">اتصال بالمتبرع</a>
    <a class="btn green" href="${nav(x.donorLoc)}" target="_blank" rel="noopener">ملاحة إلى المتبرع</a>
    <a class="btn" href="${nav(x.hospLoc)}" target="_blank" rel="noopener">ملاحة إلى المستشفى</a></div>
    ${NEXT[x.status] ? `<button class="btn main full" style="margin-top:10px" onclick="step('${x.id}','${NEXT[x.status][0]}')">${NEXT[x.status][1]}</button>` : ""}</div>`).join("")
    : '<div class="card hint">لا توجد مهام حالياً. ستظهر هنا عند تكليفك.</div>') +
    `<p class="hint">مهام مكتملة: ${disp.filter(x => x.status === "done").length}</p>
     <button class="btn full" onclick="refresh()">تحديث</button>`;
}
async function step(id, status){
  let driverLoc = null;
  try{ driverLoc = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude, lng:p.coords.longitude}), rej, {enableHighAccuracy:true, timeout:10000})); }catch(e){}
  const data = {status, updated:Date.now()}; if(driverLoc) data.driverLoc = driverLoc;
  try{ await F.updateDoc(F.doc(fs,"dispatches",id), data); toast("تم تحديث الحالة"); await refresh(); }catch(e){ toast("تعذر التحديث."); }
}

Object.assign(window, {login, logout, showMatches, assign, closeOv, confirmAssign, cancelDisp, step, refresh});
init();
</script>
</body>
</html>
